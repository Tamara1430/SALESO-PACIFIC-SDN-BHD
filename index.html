<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KYOMORI | Premium Japanese Matcha Importer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
       /* ============================= */
/* VARIABLES */
/* ============================= */
:root { 
    --matcha-dark: #1B3022;
    --matcha-mid: #3A5A40;
    --matcha-leaf: #588157;
    --matcha-bright: #A3B18A;
    --cream-bg: #F8F9F1;
    --white: #ffffff;
    --transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
}

/* ============================= */
/* BASE */
/* ============================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Montserrat',sans-serif;
    background-color:var(--cream-bg);
    color:#2d2d2d;
    scroll-behavior:smooth;
    overflow-x:hidden;
}

/* ============================= */
/* NAVBAR */
/* ============================= */
nav{
    background:var(--white);
    color:var(--matcha-dark);
    padding:1.2rem 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 20px rgba(0,0,0,.05);
    flex-wrap:wrap;
    gap:8px;
}

.logo-container{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-img{
    height:64px;
    width:auto;
}

.logo-main{
    font-family:'Cinzel',serif;
    font-size:1.05rem;
    letter-spacing:2px;
}

.logo-sub{
    font-size:.66rem;
    font-weight:600;
    opacity:.85;
}

/* ============================= */
/* HERO */
/* ============================= */
.hero{
    height:80vh;
    background:linear-gradient(rgba(27,48,34,.75),rgba(27,48,34,.75)),
    url('https://media.istockphoto.com/id/694992188/photo/matcha-green-tea.jpg?s=612x612&w=0&k=20&c=WhkrAq1QibIezJlfsNO2vRsr94GNvSOc6qMAKFw2hIc=');
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
    padding:0 20px;
}

.hero-text h1{
    font-family:'Cinzel',serif;
    font-size:3.5rem;
    margin-bottom:1.5rem;
}

.hero-text p{
    font-size:1.1rem;
    max-width:800px;
    margin:auto;
    opacity:.9;
}

/* ============================= */
/* SECTION TITLE */
/* ============================= */
.section-title{
    text-align:center;
    padding:6rem 1rem 2rem;
}

.section-title h2{
    font-family:'Cinzel',serif;
    font-size:2.5rem;
    color:var(--matcha-dark);
}

.section-title hr{
    width:80px;
    height:3px;
    background:var(--matcha-leaf);
    border:none;
    margin:15px auto;
}

/* ============================= */
/* PRODUCT GRID */
/* ============================= */
.product-grid{
    max-width:1200px;
    margin:auto;
    padding:2rem;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:3rem;
}

.card{
    background:var(--white);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
    transition:var(--transition);
    display:flex;
    flex-direction:column;
    border:1px solid rgba(0,0,0,.03);
}

.card:hover{
    transform:translateY(-15px);
    box-shadow:0 25px 50px rgba(27,48,34,.2);
}

/* ============================= */
/* SHORTS CAROUSEL (9:16) */
/* ============================= */

.img-container{
    width:100%;
    aspect-ratio:9/16;
    max-height:620px;
    background:#000;
    position:relative;
    overflow:hidden;
}

.carousel{
    width:100%;
    height:100%;
    position:relative;
}

.slides{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .6s cubic-bezier(.22,.61,.36,1);
}

.slides img,
.slides iframe{
    width:100%;
    height:100%;
    object-fit:contain; /* penting supaya shorts ga ke crop */
    flex-shrink:0;
    border:none;
    background:#000;
}

/* NAV BUTTONS */
.nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,.45);
    color:#fff;
    border:none;
    width:36px;
    height:36px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    z-index:10;
    backdrop-filter:blur(4px);
}

.prev{left:12px;}
.next{right:12px;}

.nav-btn:hover{background:rgba(0,0,0,.75);}

/* DOTS */
.dots{
    position:absolute;
    bottom:14px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
    z-index:10;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(255,255,255,.4);
    cursor:pointer;
    transition:.25s;
}

.dot.active{
    background:#fff;
    transform:scale(1.25);
}

/* ============================= */
/* CARD CONTENT */
/* ============================= */
.card-content{
    padding:2.5rem 2rem;
    flex-grow:1;
}

.card-content h3{
    font-family:'Cinzel',serif;
    font-size:1.7rem;
    color:var(--matcha-dark);
    margin-bottom:1rem;
}

.origin-badge{
    background:var(--matcha-bright);
    color:var(--matcha-dark);
    padding:4px 12px;
    font-size:.7rem;
    font-weight:600;
    border-radius:20px;
    display:inline-block;
    margin-bottom:1rem;
}

.specs{
    font-size:.85rem;
    color:#555;
    margin-bottom:2rem;
}

.specs p{
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #f0f0f0;
    padding-bottom:5px;
}

.specs strong{
    color:var(--matcha-dark);
}

.cta-btn{
    display:block;
    text-align:center;
    padding:1.2rem;
    background:var(--matcha-mid);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    letter-spacing:2px;
    border-radius:6px;
    font-size:.8rem;
}

.cta-btn:hover{background:var(--matcha-dark);}

/* ============================= */
/* SHIPPING */
/* ============================= */
.shipping{
    max-width:1000px;
    margin:6rem auto;
    background:var(--matcha-dark);
    color:#fff;
    padding:5rem 2rem;
    border-radius:15px;
    text-align:center;
}

.shipping-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
}

/* ============================= */
/* FOOTER */
/* ============================= */
footer{
    background:#0a0f0b;
    color:#555;
    padding:5rem 2rem;
    text-align:center;
}

/* ============================= */
/* RESPONSIVE */
/* ============================= */
@media(max-width:768px){
    .hero-text h1{font-size:2.5rem;}
    .shipping-grid{grid-template-columns:1fr;}
}

@media(max-width:480px){
    .img-container{max-height:none;}
}
    </script>
</body>
</html>
